[build-system]
requires = ["setuptools >= 61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "starhue"
# Version is the single source of truth in starhue/__init__.py (__version__);
# see [tool.setuptools.dynamic] below.
dynamic = ["version"]
requires-python = ">=3.8"

# starhue's core is pure standard library (math, argparse, os, sys, typing).
# It has no third-party runtime dependencies.
dependencies = []

# Optional extras. The core stays zero-dependency; matplotlib is needed only for
# Star.spectrum() plots (pip install -e '.[plot]'), and pytest only to run the
# test suite (pip install -e '.[test]').
[project.optional-dependencies]
plot = ["matplotlib>=3.5"]
test = ["pytest>=7.0", "matplotlib>=3.5"]

[tool.setuptools.dynamic]
version = {attr = "starhue.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
