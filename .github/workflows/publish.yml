# Publishes starhue to PyPI whenever a GitHub Release is published.
#
# Uses PyPI "Trusted Publishing" (OpenID Connect) — no API token or password is
# stored as a secret. PyPI verifies the workflow's signed identity instead.
# See the README / repo notes for one-time setup on pypi.org.
#
# This workflow uses third-party actions that are not certified by GitHub.

name: Upload Python Package

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  release-build:
    name: Build distributions
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Build release distributions
        run: |
          python -m pip install build
          python -m build

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: release-dists
          path: dist/

  pypi-publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest

    needs:
      - release-build

    permissions:
      # IMPORTANT: this permission is mandatory for trusted publishing
      id-token: write

    # Dedicated environment with protections for publishing is strongly recommended.
    environment:
      name: pypi
      url: https://pypi.org/p/starhue

    steps:
      - name: Retrieve release distributions
        uses: actions/download-artifact@v5
        with:
          name: release-dists
          path: dist/

      - name: Publish release distributions to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b  # v1.14.0
