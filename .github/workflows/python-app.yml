name: tests

# Run on every push to any branch and on every pull request.
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      # Don't cancel the whole matrix if one Python version fails — we want to
      # see which versions break.
      fail-fast: false
      matrix:
        # The floor (declared in pyproject's requires-python) plus recent
        # versions and the one developed against locally.
        python-version: ["3.8", "3.10", "3.12", "3.13", "3.14"]

    name: py${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install starhue + test extra
        # Pulls pytest from [project.optional-dependencies].test in pyproject.toml
        # and installs starhue itself (editable) so the tests can import it.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'

      - name: Run the test suite
        # Invoke pytest through the interpreter (not the bare `pytest` console
        # script, which may not be on PATH on the runner). It picks up
        # testpaths = ["tests"] from pyproject.toml.
        run: python -m pytest -v
